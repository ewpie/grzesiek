          - paragraph [ref=e81]: W Kurdystanie ostatni mieszkańcy antycznego miasta Hasankeyf bezsilnie patrzą, jak dziedzictwo dziewięciu cywilizacji znika pod wodą, po tym jak turecki rząd buduje tamę na rzece Tygrys. Obietnice rozwoju odbierają ludziom ich tożsamość i dawne domy, zastępując je betonowymi, co prawda nowoczesnymi budowlami, ale pozbawionych dawnej duszy.
