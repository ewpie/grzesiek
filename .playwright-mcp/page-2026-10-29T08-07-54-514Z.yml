          - paragraph [ref=e131]: Nikodem odbywa wyrok w ramach nowego programu penitencjarnego, polegającego na pracy w domu Mai i Łukasza, którzy mają nad nim pełną władzę. Pozytywne rozpatrzenie apelacji i odzyskanie wolności przez Nikodema zaskakuje domowników. Chociaż mogliby się rozejść i nigdy więcej nie spotkać, pozostają razem na jeszcze jeden dzień.
    - generic [ref=e133]:
      - img "Grzegorz Piekarski – reżyser, scenarzysta i operator filmowy" [ref=e135]
      - generic [ref=e136]:
        - paragraph [ref=e137]: GRZEGORZ PIEKARSKI
        - paragraph [ref=e138]: Reżyser i scenarzysta, urodzony w Warszawie. Absolwent Szkoły Filmowej im. Krzysztofa Kieślowskiego w Katowicach oraz Wydziału Mechatroniki Politechniki Warszawskiej. Stypendysta programu „Młoda Polska” Ministerstwa Kultury i Dziedzictwa Narodowego, członek Stowarzyszenia Filmowców Polskich, uczestnik programów Doc Lab Poland i dok.incubator. Jego fabularny film dyplomowy „Niewolnik” prezentowany był na najważniejszych polskich festiwalach filmowych, m.in. na Festiwalu Polskich Filmów Fabularnych w Gdyni, Warszawskim Festiwalu Filmowym, Camerimage oraz Międzynarodowym Festiwalu Filmowym Nowe Horyzonty we Wrocławiu. Pełnometrażowy film dokumentalny „Miasto, które wyjechało” prezentowany był na kilkudziesięciu festiwalach na całym świecie, zdobywając łącznie 10 nagród. Na festiwalu Visions du Réel w Nyonie otrzymał Nagrodę Jury Młodych, a podczas gali IDA Documentary Awards, jednych z najważniejszych nagród w światowym kinie dokumentalnym, był nominowany w kategorii Najlepsze zdjęcia. Film prezentowany był również na Ji.hlava International Documentary Film Festival i Porto/Post/Doc. W Polsce otrzymał nominację do Złotego Lajkonika na Krakowskim Festiwalu Filmowym, a także został uhonorowany Wielkim Jantarem na Koszalińskim Festiwalu Debiutów Filmowych Młodzi i Film za najlepszy debiut dokumentalny.
